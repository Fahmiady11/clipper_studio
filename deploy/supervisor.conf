; /etc/supervisor/conf.d/clipper.conf — __APP_DIR__ filled by setup-ubuntu.sh
; 2 workers: two videos are processed in parallel. Raise numprocs on a bigger server.
[program:clipper-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work --timeout=3600 --memory=512 --sleep=1
directory=__APP_DIR__
user=www-data
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=3700          ; let a running render/download finish on stop
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
stdout_logfile_maxbytes=20MB

[program:clipper-scheduler]
command=php __APP_DIR__/artisan schedule:work
directory=__APP_DIR__
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
