; /etc/supervisor/conf.d/clipper.conf — __APP_DIR__ filled by setup-ubuntu.sh
; Two workers: one analyses videos, one renders clips, so a short render never
; waits behind an hour-long analysis. Both also take the short default jobs.
; Set FFMPEG_THREADS in .env (about half the cores) so the two encodes share the CPU.
[program:clipper-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work --queue=analyze,default --timeout=3600 --memory=512 --sleep=1
directory=__APP_DIR__
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3700          ; let a running download/analysis finish on stop
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
stdout_logfile_maxbytes=20MB

[program:clipper-render]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work --queue=render,default --timeout=1800 --memory=512 --sleep=1
directory=__APP_DIR__
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=1900          ; let a running render finish on stop
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
stdout_logfile_maxbytes=20MB

[program:clipper-scheduler]
command=php __APP_DIR__/artisan schedule:work
directory=__APP_DIR__
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
