# /etc/nginx/sites-available/clipper — placeholders filled by setup-ubuntu.sh.
# certbot adds the HTTPS server block and the http→https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 60M;          # music uploads (50 MB) + overhead

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Long-lived hashed build assets
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 600;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles (.env, .git) or any other PHP file
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.php$ { return 404; }
}
