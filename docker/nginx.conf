user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 2g;

    # Behind the host nginx (TLS) -> docker port proxy -> this container, the
    # peer is the compose network gateway (172.x.0.1), which the app does not
    # trust as a proxy. So resolve the forwarded data here instead:
    # - client IP: take the last X-Forwarded-For hop (the one the host nginx
    #   appended; real_ip_recursive stays off) when the peer is a private
    #   docker/LAN address. The app port is bound to 127.0.0.1 only.
    # - scheme: pass HTTPS=on to PHP when the host proxy says https, so
    #   Laravel builds https:// URLs, secure cookies and HSTS.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    map $http_x_forwarded_proto $fwd_https {
        https   on;
        default "";
    }

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param HTTPS $fwd_https if_not_empty;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
